name: Release Desktop

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  firmware-build:
    name: Build release firmware
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python and uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Install firmware dependencies
        run: uv sync --locked

      - name: Build firmware
        run: |
          KIVO_FIRMWARE_BUILD_ID="${GITHUB_REF_NAME}" uv run pio run -e esp32s3
          KIVO_FIRMWARE_BUILD_ID="${GITHUB_REF_NAME}" uv run pio run -e rp2040

      - name: Stage release firmware
        run: |
          mkdir release-firmware
          cp .pio/build/esp32s3/firmware.factory.bin "release-firmware/kivo-${GITHUB_REF_NAME}-esp32s3.bin"
          cp .pio/build/rp2040/firmware.uf2 "release-firmware/kivo-${GITHUB_REF_NAME}-rp2040.uf2"

      - name: Upload staged firmware
        uses: actions/upload-artifact@v6
        with:
          name: release-firmware
          path: release-firmware/
          if-no-files-found: error
          retention-days: 1

  release:
    name: Build and publish ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            platform: windows-latest
            args: --bundles nsis
            studio_bundle_dir: src-tauri/target/release/bundle/nsis
            rust_targets: ""
          - name: macOS universal
            platform: macos-latest
            args: --target universal-apple-darwin --bundles dmg
            studio_bundle_dir: src-tauri/target/universal-apple-darwin/release/bundle/dmg
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install dependencies
        run: npm ci

      - name: Verify repository version
        shell: bash
        run: |
          cp .env.example .env
          python scripts/repo_version.py check "${GITHUB_REF_NAME}"

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Kivo ${{ github.ref_name }}"
          releaseBody: "Kivo and Kivo Product Studio desktop installers, plus ESP32-S3 and RP2040 firmware."
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: Build Product Studio installer
        run: >-
          npm run tauri build -- --features product-studio
          --config src-tauri/tauri.studio.conf.json ${{ matrix.args }}

      - name: Upload Product Studio installer
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STUDIO_BUNDLE_DIR: ${{ matrix.studio_bundle_dir }}
        run: |
          set -euo pipefail
          files=("$STUDIO_BUNDLE_DIR"/*)
          test -e "${files[0]}"
          gh release upload "${GITHUB_REF_NAME}" "${files[@]}" --clobber --repo "${GITHUB_REPOSITORY}"

  firmware-publish:
    name: Publish release firmware
    needs: [release, firmware-build]
    runs-on: ubuntu-latest

    steps:
      - name: Download staged firmware
        uses: actions/download-artifact@v7
        with:
          name: release-firmware
          path: release-firmware

      - name: Upload firmware to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release upload "${GITHUB_REF_NAME}" release-firmware/* --clobber
          --repo "${GITHUB_REPOSITORY}"
