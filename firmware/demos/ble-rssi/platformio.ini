[platformio]
default_envs = ble-connected-rssi

[env:ble-rssi]
platform = espressif32@7.0.1
board = esp32-s3-devkitc-1
framework = arduino
build_src_filter = +<scan_rssi.cpp>
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
upload_protocol = esptool
upload_speed = 460800
monitor_speed = 115200
monitor_dtr = 1
monitor_rts = 0

[env:ble-discovery]
extends = env:ble-rssi
build_flags =
  ${env:ble-rssi.build_flags}
  -DBLE_RSSI_DISCOVERY=1

[env:ble-connected-rssi]
extends = env:ble-rssi
build_src_filter = +<connected_rssi.cpp>
