# Hardware contract only, NOT a loadable Kivo product/profile schema.
# MCP23017 scanning, encoder polling, display scheduling and rollover support are pending.
schema: workbench-s3-i2c-hardware-draft
status: requires-new-firmware-support
board_profile_id: yd-esp32-s3
i2c:
  sda_gpio: 13
  scl_gpio: 14
  target_hz: 400000
expander:
  part: MCP23017-E/SO
  address: 32
  rows: &id001
  - GPA5
  - GPA6
  - GPA7
  columns: &id002
  - GPB0
  - GPB1
  - GPB2
  - GPB3
  - GPB4
  - GPB5
  controls:
    type: ec11_confirm_back
    confirm: GPA0
    encoder_press: GPA1
    encoder_a: GPA2
    encoder_b: GPA3
    back: GPA4
  output_only_pins:
  - GPA7
  - GPB7
  unused_pins:
  - GPB6
  - GPB7
  i2c_target_hz: 400000
  scan_target_hz: 1000
  oled_chunk_bytes: 8
display:
  controller: SH1106
  address_candidates:
  - 60
  - 61
matrix:
  rows: *id001
  columns: *id002
  diode_direction: COL2ROW
  keys:
    KEY_1:
    - GPA5
    - GPB0
    KEY_2:
    - GPA5
    - GPB1
    KEY_3:
    - GPA5
    - GPB2
    KEY_4:
    - GPA5
    - GPB3
    KEY_5:
    - GPA5
    - GPB4
    KEY_6:
    - GPA5
    - GPB5
    KEY_7:
    - GPA6
    - GPB0
    KEY_8:
    - GPA6
    - GPB1
    KEY_9:
    - GPA6
    - GPB2
    KEY_10:
    - GPA6
    - GPB3
    KEY_11:
    - GPA6
    - GPB4
    KEY_12:
    - GPA6
    - GPB5
    KEY_13:
    - GPA7
    - GPB0
    KEY_14:
    - GPA7
    - GPB1
    KEY_15:
    - GPA7
    - GPB2
    KEY_16:
    - GPA7
    - GPB3
    KEY_17:
