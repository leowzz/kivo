schema_version: 3
profile:
  id: phone-numeric-terminal
  name: Phone Numeric Terminal
  groups:
    - id: R1
      columns: 3
      buttons:
        - { id: K1, label: "1" }
        - { id: K2, label: "2" }
        - { id: K3, label: "3" }
    - id: R2
      columns: 3
      buttons:
        - { id: K4, label: "4" }
        - { id: K5, label: "5" }
        - { id: K6, label: "6" }
    - id: R3
      columns: 3
      buttons:
        - { id: K7, label: "7" }
        - { id: K8, label: "8" }
        - { id: K9, label: "9 / Confirm" }
trigger_settings:
  long_press_ms: 500
  double_press_ms: 300
hardware_profiles:
  - id: hardware
    name: YD-RP2040 3x3 direct
    board_profile_id: yd-rp2040
    debounce_ms: 30
    inputs:
      - type: direct
        id: direct-1
        keys:
          K1: 1
          K2: 2
          K3: 3
          K4: 4
          K5: 5
          K6: 6
          K7: 7
          K8: 8
          K9: 9
  - id: esp-hardware
    name: YD-ESP32-S3 3x3 direct
    board_profile_id: yd-esp32-s3
    debounce_ms: 30
    inputs:
      - type: direct
        id: direct-1
        keys:
          K1: 1
          K2: 2
          K3: 3
          K4: 4
          K5: 5
          K6: 6
          K7: 7
          K8: 8
          K9: 9
actions:
  K1:
    press:
      - type: paste
        text: "1"
  K2:
    press:
      - type: paste
        text: "2"
  K3:
    press:
      - type: paste
        text: "3"
  K4:
    press:
      - type: paste
        text: "4"
  K5:
    press:
      - type: paste
        text: "5"
  K6:
    press:
      - type: paste
        text: "6"
  K7:
    press:
      - type: paste
        text: "7"
  K8:
    press:
      - type: paste
        text: "8"
  K9:
    press:
      - type: paste
        text: "9"
    long_press:
      - type: hotkey
        keys: [enter]
