[package]
name = "kivo"
version = "0.7.4"
description = "Desktop helper for the Kivo GPIO keyboard"
edition = "2024"
default-run = "kivo"

[lib]
name = "kivo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
base64 = "0.22"
notify = "8.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml_ng = "0.10"
sha2 = "0.10"
rusqlite = { version = "0.37", features = ["bundled"] }
nusb = "0.2.5"
serialport = { version = "4.9", default-features = false }
tauri = { version = "2.11.5", features = ["image-png", "tray-icon"] }
tauri-plugin-dialog = "2.7.2"
tauri-plugin-log = "2.9.0"

[features]
default = []
product-studio = []

[[bin]]
name = "kivo-product"
path = "src/bin/kivo-product.rs"
# Only build/bundle this CLI when the product-studio feature is enabled; otherwise
# tauri tries to lipo+bundle it into the app on macOS universal builds and fails.
required-features = ["product-studio"]

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3"
tauri = { version = "2.11.5", features = ["test"] }
