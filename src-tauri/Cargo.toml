[package]
name = "vibe-tool"
version = "0.1.0"
description = "Desktop helper for the Vibe Tool GPIO keyboard"
edition = "2024"

[lib]
name = "vibe_tool_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml_ng = "0.10"
serialport = { version = "4.9", default-features = false }
tauri = { version = "2.11.5", features = [] }
